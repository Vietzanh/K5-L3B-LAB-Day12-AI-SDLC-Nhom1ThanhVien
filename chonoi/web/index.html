<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 18px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp. CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input; màn hình (menu, intro,
 * kết quả) đóng bằng POST /continue. Trường nào snapshot chưa có thì bỏ qua.
 * Phím: WASD/mũi tên di chuyển · E tương tác · Space bắt cá · Esc/P tạm dừng · H tương phản cao · R chơi lại
 *       Shop: 1 bình oxy · 2 áo phao · Enter xong · Màn hình: Enter/Space tiếp tục.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- giao diện: bảng màu thường / tương phản cao (lưu cục bộ) ----------
const THEMES = {
  normal: { bg: "#10161c", fg: "#e8eef2", dim: "#9fb3c0", sky: "#f6d7c3", water0: "#5aa9a0", water1: "#1d3b3a", floor: "#c9a36b",
            wall: "#6b4a2b", warn: "#ff6b6b", ok: "#7bd389", accent: "#ffd166", monster: "#b26bff", player: "#ff8a3d", panel: "rgba(10,14,18,.78)" },
  high:   { bg: "#000000", fg: "#ffffff", dim: "#ffffff", sky: "#ffffff", water0: "#0033cc", water1: "#000033", floor: "#ffffff",
            wall: "#000000", warn: "#ffff00", ok: "#00ff00", accent: "#00ffff", monster: "#ff00ff", player: "#ff8000", panel: "rgba(0,0,0,.92)" },
};
let themeName = "normal";
try { themeName = new URLSearchParams(location.search).get("theme") || localStorage.getItem("chonoi.theme") || "normal"; } catch (e) {}
let T = THEMES[themeName] || THEMES.normal;
function toggleTheme() {
  themeName = themeName === "high" ? "normal" : "high"; T = THEMES[themeName];
  try { localStorage.setItem("chonoi.theme", themeName); } catch (e) {}
}

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const phase = snap ? snap.phase : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (phase === "quan") dy = -dy;                               // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"), pause: down.has("pause"),
           shop_done: down.has("shop_done") };
}
function send(obj) { queue.push(JSON.stringify(obj)); flush(); }
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s; queue.push(s); flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
const post = (p) => fetch(p, { method: "POST" }).catch(() => {});
function keyName(e) { return e.key.toLowerCase(); }
let quitMsg = false;
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (k === " " || k.startsWith("arrow")) e.preventDefault();
  if (e.repeat) return;
  if (k === "h") { toggleTheme(); return; }
  if (k === "r") { post("/restart"); lastSent = ""; down.clear(); quitMsg = false; return; }
  if (snap && snap.screen) {                       // đang hiện màn hình: chỉ tiếp tục / thoát
    if (snap.screen === "menu" && k === "q") { quitMsg = true; return; }
    if (["enter", " ", "e"].includes(k)) post("/continue");
    return;
  }
  const paused = snap && snap.state === "paused";
  if (paused && k === "m") { post("/restart"); lastSent = ""; down.clear(); return; }
  if (MOVE_KEYS[k]) down.add(MOVE_KEYS[k]);
  else if (k === "e") down.add("interact");
  else if (k === " ") down.add("catch");
  else if (k === "escape" || k === "p") down.add("pause");
  else if (snap && snap.phase === "shop") {
    if (k === "1") send({ buy: "oxygen" });
    else if (k === "2") send({ buy: "hp" });
    else if (k === "enter") down.add("shop_done");
  }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  else if (k === "escape" || k === "p") down.delete("pause");
  else if (k === "enter") down.delete("shop_done");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
let introTimerKey = null;
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
    // DayIntro tự chuyển sau 4 s
    const key = snap.screen === "day_intro" ? "d" + snap.day : null;
    if (key && key !== introTimerKey) { introTimerKey = key; setTimeout(() => { if (snap && snap.screen === "day_intro") post("/continue"); }, 4000); }
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ: tiện ích ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng muối ớt", lau_mam: "Lẩu mắm miền Tây" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const kn = (k) => KIND_NAME[k] || k;
const dn = (k) => DISH_NAME[k] || k;
const blink = () => Math.floor(performance.now() / 250) % 2 === 0;

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.bold ? "bold " : "") + Math.max(18, o.size || 18) + "px system-ui, Arial, sans-serif";  // chữ không chân ≥ 18 px
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (o.outline !== false) { ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.75)"; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.color || T.fg;
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color) {
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = T.fg; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
}
function panel(x, y, w, h) { ctx.fillStyle = T.panel; ctx.fillRect(x, y, w, h); ctx.strokeStyle = T.accent; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h); }
function fmtTime(ticks) { const s = Math.ceil((ticks || 0) / 60); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function counts(arr) { const c = {}; (arr || []).forEach((k) => { const kk = typeof k === "string" ? k : k.kind; c[kk] = (c[kk] || 0) + 1; }); return c; }
function stockMap(st) { if (!st) return {}; if (Array.isArray(st)) return counts(st); return st; }
function itemFresh(it) { return typeof it === "object" && it ? it.fresh : null; }

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 96, bottom = 96;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  ctx.fillStyle = T.sky; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, T.water0); g.addColorStop(1, T.water1);
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = T.fg; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  for (const d of [10, 20]) { ctx.strokeStyle = "rgba(255,255,255,.15)"; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke(); ctx.setLineDash([]); }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = T.accent; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  // nút hái
  (snap.nodes || []).forEach((n) => {
    ctx.globalAlpha = n.ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    if (!n.ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) - 0.8 * s, { align: "center" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
  });
  // thủy quái
  (snap.monsters || []).forEach((m) => {
    ctx.fillStyle = T.monster; ctx.globalAlpha = m.state === "recoil" ? 0.5 : 1;
    ctx.beginPath(); ctx.ellipse(sx(m.pos[0]), sy(m.pos[1]), 1.6 * s, 0.6 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    if (m.state === "chase") text("!", sx(m.pos[0]), sy(m.pos[1]) - 0.9 * s, { align: "center", color: T.warn, bold: true });
  });
  // người chơi
  const p = snap.player;
  let near = null;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (!(p.invuln_ticks > 0 && blink())) {
      ctx.fillStyle = T.player; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = T.fg; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
    // gợi ý hái / cập bến
    const dist = (q) => Math.hypot(q[0] - p.pos[0], q[1] - p.pos[1]);
    if (dist(dp) <= dr) near = "E: cập bến";
    else if (p.at_surface) {
      const n = (snap.nodes || []).filter((n) => n.ready && dist(n.pos) <= (meta.interact_radius || 2)).sort((a, c) => dist(a.pos) - dist(c.pos))[0];
      if (n) near = "E: hái " + kn(n.kind);
    } else if ((snap.fish || []).some((f) => dist(f.pos) <= (meta.catch_radius || 2))) near = "Space: bắt cá";
    if (near) text(near, px, py - 1.2 * s, { align: "center", color: T.accent, bold: true });
  }
  // cảnh báo
  const deep = p && p.pos[1] >= 10;
  const monsterNear = p && (snap.monsters || []).some((m) => m.state === "chase" || (deep && Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) <= 12));
  if (monsterNear) { ctx.strokeStyle = T.monster; ctx.lineWidth = 10; ctx.strokeRect(5, 5, w - 10, h - 10); text("⚠ Thủy quái!", w / 2, top + 30, { align: "center", size: 30, bold: true, color: T.monster }); }
  if (p && p.oxygen_ticks === 0 && !p.at_surface) text("⚠ Hết hơi! Nổi lên ngay!", w / 2, top + 66, { align: "center", size: 28, bold: true, color: T.warn });
  // HUD trên
  const tl = snap.time_left_ticks;
  text("⏱ " + fmtTime(tl), 16, 34, { size: 26, bold: true, color: tl <= 1800 ? T.warn : T.fg });
  if (p) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(140, 14, 240, 26, p.oxygen_ticks / p.oxygen_max_ticks, low ? (blink() ? T.warn : "#7a1d1d") : "#4fc3f7");
    text((low ? "⚠ " : "") + "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s", 260, 34, { align: "center" });
    let hs = ""; for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text("Máu " + hs, 400, 34, { size: 24, color: "#ff6b81" });
    text("Độ sâu " + p.pos[1].toFixed(1) + " m", 16, 66);
    if (p.catch_cd_ticks > 0) text("Hồi bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 230, 66, { color: T.dim });
    else text("Bắt cá: sẵn sàng", 230, 66, { color: T.ok });
  }
  text("Ngày " + (snap.day || "-") + " · Tiền " + (snap.money ?? 0) + "k · Uy tín " + (snap.reputation ?? 0).toFixed(1), w - 16, 34, { align: "right" });
  // giỏ + danh sách cần lấy
  const hold = snap.hold || [];
  const cap = snap.hold_capacity || 12, sz = Math.min(36, (w * 0.5) / cap - 4), y0 = h - bottom + 10;
  for (let i = 0; i < cap; i++) {
    const x0 = 16 + i * (sz + 4);
    ctx.fillStyle = "rgba(255,255,255,.15)"; ctx.fillRect(x0, y0, sz, sz);
    const it = hold[i];
    if (it) {
      const kind = typeof it === "string" ? it : it.kind, fr = itemFresh(it);
      ctx.fillStyle = kc(kind); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6);
      if (fr !== null) { ctx.fillStyle = fr < 30 ? T.warn : T.ok; ctx.fillRect(x0 + 3, y0 + sz - 7, (sz - 6) * fr / 100, 4); if (fr < 30) text("ươn", x0 + sz / 2, y0 + sz / 2 + 6, { align: "center", color: T.warn }); }
    }
  }
  const hc = counts(hold);
  text("Giỏ " + hold.length + "/" + cap + ": " + (Object.keys(hc).map((k) => kn(k) + "×" + hc[k]).join(", ") || "trống"), 16, y0 + sz + 26);
  const need = (snap.day_plan && snap.day_plan.ingredients) || null;
  if (need) {  // danh sách Má Tư cần: đã lấy/cần, góc dưới phải (không che cảnh)
    const usable = counts(hold.filter((it) => itemFresh(it) === null || itemFresh(it) >= 30));  // hàng ươn không nấu được
    const items = Object.keys(need).map((k) => { const got = usable[k] || 0; return { s: kn(k) + " " + got + "/" + need[k], ok: got >= need[k] }; });
    const x0 = Math.max(16 + cap * (sz + 4) + 24, w * 0.55);
    text("Má Tư cần:", x0, y0 + 18, { bold: true });
    let x = x0 + 120, y = y0 + 18;
    items.forEach((it) => {
      ctx.font = "18px system-ui, Arial, sans-serif";
      const wd = ctx.measureText(it.s).width + 40;
      if (x + wd > w - 10) { x = x0; y += 26; }
      text((it.ok ? "✓ " : "• ") + it.s, x, y, { color: it.ok ? T.ok : T.fg });
      x += wd;
    });
  }
  text("WASD bơi · E hái/cập bến · Space bắt · Esc tạm dừng · H tương phản", w - 16, h - 14, { align: "right", color: T.dim });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 100, bottom = 70;
  const s = Math.max(1, Math.min((w - 340) / X, (h - top - bottom) / Z));
  const ox = 20, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = T.floor; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = T.wall; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  const menu = snap.menu || {};
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#2e9d4f" : "#555a60";
    ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 6, { align: "center" });
    if (st.state === "cooking" && st.dish) {
      const total = ((menu[st.dish.dish_id] || {}).cook_s || 1) * 60;
      bar(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) + 0.9 * s, 1.6 * s, 10, 1 - st.cook_ticks_left / total, T.accent);
    }
    if (st.state === "ready") text("CHÍN!", sx(st.pos[0]), sy(st.pos[1]) - 0.95 * s, { align: "center", color: T.ok, bold: true });
  });
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  let angry = false;
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 6, { align: "center" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      const frac = c.patience_ticks_left / patMax, low = c.state === "waiting" && frac < 0.25;
      if (low) angry = true;
      ctx.fillStyle = c.state === "eating" ? T.ok : (low ? T.warn : "#f4b6c2"); ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      if (c.state === "waiting") { bar(cx - 0.9 * s, cy + 0.65 * s, 1.8 * s, 8, frac, low ? T.warn : "#e57373"); text((low ? "😠 " : "") + dn(c.dish_id), cx, cy - 0.8 * s, { align: "center", color: low ? T.warn : T.fg }); }
      else text("đang ăn", cx, cy - 0.8 * s, { align: "center", color: T.ok });
    }
  });
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    ctx.strokeStyle = T.fg; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, (meta.interact_radius || 1.5) * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = T.player; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
  }
  if (angry) text("⚠ Khách sắp giận! Phục vụ nhanh!", sx(X / 2), top - 14, { align: "center", size: 26, bold: true, color: T.warn });
  // HUD
  const tl = snap.time_left_ticks;
  text("⏱ " + fmtTime(tl), 16, 34, { size: 26, bold: true, color: tl <= 1800 ? T.warn : T.fg });
  text("Tiền ca " + (snap.money ?? 0) + "k · Uy tín " + (snap.reputation ?? 0).toFixed(1) + " · Điểm " + (snap.score ?? 0), 150, 34, { size: 22 });
  const hand = snap.hand ? dn(snap.hand.dish_id) : "—";
  text("Trên tay: " + hand, 16, 66, { color: snap.hand ? T.accent : T.fg });
  // kho khả dụng (tồn − phần đang giữ chỗ) + độ tươi trung bình + số món ươn theo loại (v1.2)
  const rows = {};
  const heldIds = new Set();
  (snap.customers || []).forEach((c) => (Array.isArray(c.reserved) ? c.reserved : []).forEach((id) => heldIds.add(id)));
  if (Array.isArray(snap.stock)) {
    snap.stock.forEach((it) => {
      const r = rows[it.kind] || (rows[it.kind] = { free: 0, held: 0, spoiled: 0, sum: 0, n: 0 });
      if (it.fresh < 30) r.spoiled++; else if (heldIds.has(it.id)) r.held++; else { r.free++; r.sum += it.fresh; r.n++; }
    });
  } else {
    const held = {};
    (snap.customers || []).forEach((c) => Object.entries(c.reserved || {}).forEach(([k, n]) => (held[k] = (held[k] || 0) + n)));
    Object.entries(snap.stock || {}).forEach(([k, n]) => (rows[k] = { free: n - (held[k] || 0), held: held[k] || 0, spoiled: 0, sum: 0, n: 0 }));
  }
  const kinds = Object.keys(rows).sort();
  const px0 = w - 330;
  panel(px0, top, 316, 44 + Math.max(1, kinds.length) * 28);
  text("Kho khả dụng (tươi TB)", px0 + 12, top + 28, { bold: true });
  if (!kinds.length) text("(trống)", px0 + 12, top + 58, { color: T.dim });
  kinds.forEach((k, i) => {
    const r = rows[k], y = top + 58 + i * 28;
    const avg = r.n ? Math.round(r.sum / r.n) + "%" : "";
    text(kn(k) + ": " + r.free + (avg ? " (" + avg + ")" : "") + (r.held ? " +" + r.held + " giữ" : ""), px0 + 12, y,
         { color: r.n && r.sum / r.n < 45 ? T.warn : T.fg });
    if (r.spoiled) text("⚠ " + r.spoiled + " ươn", px0 + 304, y, { align: "right", color: T.warn, bold: true });
  });
  text("WASD đi · E nấu/bưng/phục vụ · Esc tạm dừng · H tương phản", w - 16, h - 14, { align: "right", color: T.dim });
}

// ----- SHOP -----
function drawShop(w, h) {
  panel(w / 2 - 330, 90, 660, 380);
  text("Shop cuối ngày — Ngày " + (snap.day || 1), w / 2, 130, { align: "center", size: 28, bold: true });
  text("Tiền: " + snap.money + "k · đóng sau " + fmtTime(snap.time_left_ticks), w / 2, 168, { align: "center" });
  const cfg = (snap.shop_cfg || {}).upgrades || {}, up = snap.upgrades || {}, act = snap.active_upgrades || {};
  const rows = [["1", "oxygen", "Bình oxy", (l) => l.oxygen_max_s + " s"], ["2", "hp", "Áo phao", (l) => l.hp_max + " Máu"]];
  rows.forEach(([key, id, name, val], i) => {
    const lv = up[id] || 0, levels = cfg[id] || [], nxt = levels[lv];
    const y = 220 + i * 70;
    text("[" + key + "] " + name + " — cấp " + lv + "/" + levels.length + ((act[id] || 0) !== lv ? " (hiệu lực từ Ngày sau)" : ""), w / 2 - 300, y, { bold: true });
    text(nxt ? "Cấp " + nxt.level + ": " + val(nxt) + " — giá " + nxt.price + "k" + (snap.money < nxt.price ? " (thiếu tiền)" : "") : "Đã tối đa", w / 2 - 270, y + 30, { color: nxt && snap.money >= nxt.price ? T.ok : T.dim });
  });
  const last = (snap.events || []).filter((e) => e.name === "bought" || e.name === "buy_failed").slice(-1)[0];
  if (last) text(last.name === "bought" ? "Đã mua " + last.data.upgrade + " cấp " + last.data.level : "Không mua được: " + ({ funds: "thiếu tiền", max_level: "đã tối đa", unknown: "không hỗ trợ" }[last.data.reason] || last.data.reason), w / 2, 400, { align: "center", color: last.name === "bought" ? T.ok : T.warn });
  text("Enter: xong, sang Ngày mới", w / 2, 445, { align: "center", color: T.accent });
}

// ----- màn hình -----
function screen(w, h) {
  const sc = snap.screen;
  ctx.fillStyle = "rgba(0,0,0,.72)"; ctx.fillRect(0, 0, w, h);
  const cx = w / 2;
  const plan = snap.day_plan || {};
  if (sc === "menu") {
    text("Quán Ăn Chợ Nổi", cx, h / 2 - 120, { align: "center", size: 48, bold: true, color: T.accent });
    text("Út Sen lặn bắt cá, hái bông buổi sáng — tối mở quán trên nhà bè của Má Tư", cx, h / 2 - 70, { align: "center" });
    text("▶ Chơi (Enter)", cx, h / 2, { align: "center", size: 28, bold: true });
    text("✕ Thoát (Q)", cx, h / 2 + 44, { align: "center", size: 24 });
    text("WASD bơi/đi · E tương tác · Space bắt cá · Esc tạm dừng · H tương phản cao", cx, h / 2 + 110, { align: "center", color: T.dim });
    if (quitMsg) text("Đã thoát — có thể đóng tab này (Ctrl+C ở terminal để tắt máy chủ).", cx, h / 2 + 160, { align: "center", color: T.warn });
  } else if (sc === "day_intro") {
    text("Ngày " + snap.day, cx, h / 2 - 140, { align: "center", size: 48, bold: true, color: T.accent });
    text("Má Tư: \"Hôm nay má tính nấu mấy món này nghen con:\"", cx, h / 2 - 90, { align: "center" });
    Object.entries(plan.dishes || {}).forEach(([d, n], i) => text(dn(d) + " × " + n, cx, h / 2 - 50 + i * 30, { align: "center", bold: true }));
    const ing = Object.entries(plan.ingredients || {}).map(([k, n]) => kn(k) + " ×" + n).join(" · ");
    text("Cần lấy: " + ing, cx, h / 2 + 70, { align: "center", color: T.ok });
    text("Tự bắt đầu sau 4 giây — hoặc nhấn Enter", cx, h / 2 + 130, { align: "center", color: T.dim });
  } else if (sc === "evening_intro") {
    text("Chiều tối — mở quán", cx, h / 2 - 130, { align: "center", size: 40, bold: true, color: T.accent });
    const st = stockMap(snap.stock);
    text("Nhập kho: " + (Object.entries(st).map(([k, n]) => kn(k) + " ×" + n).join(" · ") || "(trống — ngất hoặc về tay không)"), cx, h / 2 - 70, { align: "center" });
    const can = Object.keys(plan.dishes || snap.menu || {}).filter((d) => { const r = (snap.menu[d] || {}).recipe || {}; return Object.entries(r).every(([k, n]) => (st[k] || 0) >= n); });
    text("Món nấu được: " + (can.map(dn).join(", ") || "chưa đủ món nào"), cx, h / 2 - 30, { align: "center", color: can.length ? T.ok : T.warn });
    text("Enter để mở quán", cx, h / 2 + 50, { align: "center", color: T.dim });
  } else if (sc === "result") {
    const s = snap.stats || {};
    const dr = (s.rep_end - s.rep_start);
    text("Kết quả Ngày " + snap.day, cx, h / 2 - 130, { align: "center", size: 40, bold: true, color: T.accent });
    text("Khách đã phục vụ: " + s.served + " · bỏ đi: " + s.left, cx, h / 2 - 70, { align: "center" });
    text("Thu trong ca: " + s.earned + "k (boa " + s.tips + "k) · Tiền hiện có: " + snap.money + "k", cx, h / 2 - 36, { align: "center" });
    text("Uy tín: " + (s.rep_start ?? 0).toFixed(1) + " → " + (s.rep_end ?? 0).toFixed(1) + " (" + (dr >= 0 ? "+" : "") + dr.toFixed(1) + ")", cx, h / 2 - 2, { align: "center", color: dr >= 0 ? T.ok : T.warn });
    text("Enter để vào Shop", cx, h / 2 + 60, { align: "center", color: T.dim });
  } else if (sc === "summary") {
    const t = snap.totals || {}, sold = t.sold || {};
    const best = Object.entries(sold).sort((a, b) => b[1] - a[1])[0];
    text(snap.mode === "day" ? "Tổng kết " + (snap.days_completed || 0) + " Ngày" : "Kết thúc: " + (snap.reason || ""), cx, h / 2 - 130, { align: "center", size: 40, bold: true, color: T.accent });
    text("Tổng tiền: " + snap.money + "k · Tổng thu: " + snap.earned + "k", cx, h / 2 - 70, { align: "center" });
    text("Điểm: " + snap.score + " · Uy tín: " + (snap.reputation ?? 0).toFixed(1), cx, h / 2 - 36, { align: "center", bold: true });
    text("Món bán chạy: " + (best ? dn(best[0]) + " (" + best[1] + " suất)" : "—"), cx, h / 2 - 2, { align: "center" });
    text("R để chơi lại", cx, h / 2 + 60, { align: "center", color: T.dim });
  }
}
function pauseMenu(w, h) {
  ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, w, h);
  panel(w / 2 - 220, h / 2 - 110, 440, 220);
  text("Tạm dừng", w / 2, h / 2 - 60, { align: "center", size: 34, bold: true });
  text("▶ Tiếp tục (Esc / P)", w / 2, h / 2, { align: "center", size: 24 });
  text("⌂ Về menu (M)", w / 2, h / 2 + 44, { align: "center", size: 24 });
  text("H: tương phản cao " + (themeName === "high" ? "BẬT" : "TẮT"), w / 2, h / 2 + 88, { align: "center", color: T.dim });
}

// ----- FPS (đo khung hình thật, hiện góc dưới trái) -----
let fpsFrames = 0, fpsT0 = performance.now(), fps = 0;
function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = T.bg; ctx.fillRect(0, 0, w, h);
  fpsFrames++; const now = performance.now(); if (now - fpsT0 >= 1000) { fps = fpsFrames * 1000 / (now - fpsT0); fpsFrames = 0; fpsT0 = now; }
  if (!snap) { text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center" }); return; }
  if (snap.phase === "quan") drawQuan(w, h); else if (snap.phase === "shop") drawShop(w, h); else drawGather(w, h);
  if (snap.state === "paused") pauseMenu(w, h);
  if (snap.screen) screen(w, h);
  if (offline) text("Mất kết nối tới máy chủ", w / 2, 30, { align: "center", color: T.warn });
  if (snap.error) text("Luật báo lỗi — xem terminal. R để chơi lại.", w / 2, 60, { align: "center", color: T.warn });
  text(Math.round(fps) + " FPS", w - 16, 66, { align: "right", color: T.dim });
}
requestAnimationFrame(frame);
</script>
